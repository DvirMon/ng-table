<button
  #triggerButton
  type="button"
  class="select-trigger"
  role="combobox"
  aria-haspopup="menu"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="menuId"
  (click)="onTriggerClick($event)"
>
  <span class="select-trigger-label">{{ selectedLabel() ?? placeholder() }}</span>
  <ng-icon name="lucideChevronDown" size="12px" color="currentColor" />
</button>
<ngpt-dropdown-menu
  [id]="menuId"
  [items]="items()"
  [open]="open()"
  (select)="onSelect($event)"
  (closed)="onClosed()"
/>
