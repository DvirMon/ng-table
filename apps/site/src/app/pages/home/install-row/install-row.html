<pre class="command"><span class="prompt" aria-hidden="true">$ </span>{{ command() }}</pre>
<button
  ngptIconButton
  ngptCopyConfirm
  #copy="ngptCopyConfirm"
  [size]="30"
  [text]="command()"
  idleLabel="Copy install command"
  failedLabel="Copy failed — select the command manually"
>
  @switch (copy.state()) { @case ('copied') {
  <ng-icon
    name="lucideCheck"
    size="var(--ngpt-sys-icon-size-sm)"
    color="currentColor"
    aria-hidden="true"
  />
  } @case ('failed') {
  <ng-icon
    name="lucideTriangleAlert"
    size="var(--ngpt-sys-icon-size-sm)"
    color="currentColor"
    aria-hidden="true"
  />
  } @default {
  <ng-icon
    name="lucideCopy"
    size="var(--ngpt-sys-icon-size-sm)"
    color="currentColor"
    aria-hidden="true"
  />
  } }
</button>
