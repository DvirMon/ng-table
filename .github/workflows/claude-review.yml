# Independent PR review by Claude — advisory, NOT a required check.
# Inputs verified against anthropics/claude-code-action@v1.0.234 action.yml
# and examples/pr-review-comprehensive.yml. Pin by SHA at install.
# Needs secret: ANTHROPIC_API_KEY.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false && secrets.ANTHROPIC_API_KEY != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.sha }}

            Review this PR along two axes and report them side by side.

            1. Standards — does the diff follow this repo's documented
               standards? Read CLAUDE.md / AGENTS.md, .claude/rules/,
               docs/agents/ and any domain CLAUDE.md next to changed files.
               Cite the rule for every finding.
            2. Spec — does the diff do what the linked issue asks? The
               issue is the `Closes #N` in the PR body; read it with
               `gh issue view N --comments`, plus the spec and
               4-tasks/issue-N/ files the PR body's Evidence points to.
               Flag missing acceptance criteria and out-of-scope changes.

            Also check the commit story: one concern per commit, messages
            match what each commit changes.

            Use inline comments for line-specific findings and one
            summary comment. Only report issues you verified in the code.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),Read,Glob,Grep"
