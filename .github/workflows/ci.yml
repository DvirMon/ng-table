name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci --prefer-offline --no-audit --fund=false

      - uses: nrwl/nx-set-shas@v5

      - run: npm run llms:check
      - run: npx nx affected -t lint typecheck

      # TEMPORARY: exclude carried over from acme for known-failing test until fixed
      - run: npx nx affected -t test --exclude=ng-table
      - run: npx nx affected -t build

  # The one CI check the main ruleset requires. List every other job in
  # `needs`; a skipped (affected-only) job counts as ok.
  ci-gate:
    if: always()
    needs: [main]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "ci-gate green"
