name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Backstop for the commit-msg hook (--no-verify, a clone where
      # `npm install` never ran). docs/agents/issue-tracker.md#closing-trailer
      - name: Check commit trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::warning::No usable base ($BASE) — checking $HEAD only."
            BASE="$HEAD~1"
          fi
          node tools/check-commit-trailers.cjs --range "$BASE..$HEAD"

      - run: npm ci --prefer-offline --no-audit --fund=false

      - uses: nrwl/nx-set-shas@v5

      - run: npm run llms:check
      - run: npx nx affected -t lint typecheck

      # TEMPORARY: exclude carried over from acme for known-failing test until fixed
      - run: npx nx affected -t test --exclude=ng-table
      - run: npx nx affected -t build
