name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - uses: nrwl/nx-set-shas@v5

      - run: npm run llms:check
      - run: npx nx affected -t lint typecheck

      # TEMPORARY: exclude carried over from acme for known-failing test until fixed
      - run: npx nx affected -t test --exclude=ng-table
      - run: npx nx affected -t build
