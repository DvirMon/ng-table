name: Close linked issue on CI green

# Contract: docs/agents/issue-tracker.md#closing-trailer
# Logic:    .github/scripts/issue-autoclose.cjs

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  issues:
    types: [closed, reopened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

# Two sub-issues closing together must not both decide on the same epic.
concurrency:
  group: issue-autoclose
  cancel-in-progress: false

jobs:
  close-linked-issue:
    if: >-
      github.event_name == 'issues' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Default branch, not the CI run's head: the script is trusted code.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            tools

      - uses: actions/github-script@v7
        with:
          script: |
            const main = require('./.github/scripts/issue-autoclose.cjs');
            await main({ github, context, core });
