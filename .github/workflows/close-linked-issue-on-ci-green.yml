name: Close linked issue on CI green

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  issues: write
  pull-requests: read

jobs:
  close-linked-issue:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const wr = context.payload.workflow_run;
            const closesPattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;

            async function closeIssue(issueNumber, body) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed',
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }

            if (wr.pull_requests.length > 0) {
              for (const linked of wr.pull_requests) {
                const { data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: linked.number,
                });
                if (pr.state !== 'open' || pr.base.ref !== 'main') continue;

                for (const match of pr.body?.matchAll(closesPattern) ?? []) {
                  await closeIssue(
                    Number(match[1]),
                    `Closed automatically — CI passed on PR #${pr.number} (${wr.html_url}).`
                  );
                }
              }
            } else if (wr.event === 'push' && wr.head_branch === 'main') {
              const message = wr.head_commit?.message ?? '';
              for (const match of message.matchAll(closesPattern)) {
                await closeIssue(
                  Number(match[1]),
                  `Closed automatically — CI passed on commit ${wr.head_sha.slice(0, 7)} (${wr.html_url}).`
                );
              }
            }
