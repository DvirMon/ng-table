name: Close linked issue on CI green

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  issues: write
  pull-requests: read

jobs:
  close-linked-issue:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const wr = context.payload.workflow_run;
            for (const linked of wr.pull_requests) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: linked.number,
              });
              if (pr.state !== 'open' || pr.base.ref !== 'main') continue;

              const closesPattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
              for (const match of pr.body?.matchAll(closesPattern) ?? []) {
                const issueNumber = Number(match[1]);
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'closed',
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `Closed automatically — CI passed on PR #${pr.number} (${wr.html_url}).`,
                });
              }
            }
