# Server-side mirror of the local hooks — cannot be skipped with --no-verify.
# Required check: `pr-conventions`. Rules: tools/commit-trailers.cjs,
# contract: docs/agents/issue-tracker.md#issue-references.
# Pin actions by SHA at install.
name: PR conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: node tools/validate-branch-name.mjs "$BRANCH"

      - name: PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node tools/check-commit-trailers.cjs --title "$TITLE"

      # Headers, Refs trailers, no closing keywords, no merge or fixup commits.
      - name: Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tools/check-commit-trailers.cjs --range "$BASE..$HEAD"

      # Issue branches (<type>/<N>-<slug>) must link issue N in the body:
      # `Closes #N`, or `Refs #N` when the PR only partly delivers it.
      # Other branches (docs/<slug>, chore/<slug>-archive, chore/sync-<date>)
      # reference freely and close nothing required.
      - name: PR body links the issue
        env:
          BRANCH: ${{ github.head_ref }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          issue=$(printf '%s' "$BRANCH" | sed -nE 's@^[a-z]+/([0-9]+)-.*@\1@p')
          if [ -z "$issue" ]; then
            echo "Not an issue branch — no closing reference required."
            exit 0
          fi
          if ! printf '%s' "$BODY" | grep -qiE "\b(close[sd]?|fix(e[sd])?|resolve[sd]?|refs:?) #$issue\b"; then
            echo "::error::PR body must contain 'Closes #$issue' (or 'Refs #$issue' for a partial PR)."
            exit 1
          fi
